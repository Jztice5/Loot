[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "loot"
version = "0.1.0"
description = "Personal multi-market signal monitoring system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0.36,<3",
]

[project.optional-dependencies]
dev = [
    "PyYAML>=6,<7",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
